<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Weight Tracker: Interstellar Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Cosmic Weight Tracker</h1>
        <p>Your journey from Earth to the edge of the observable universe.</p>
        
        <div class="form-group">
            <div class="input-row">
                <div>
                    <label for="startWeight">Starting Weight (lbs/kg):</label>
                    <input type="number" id="startWeight" placeholder="e.g., 200" oninput="saveToLocalStorage()">
                </div>
                <div>
                    <label for="currentWeight">Current Weight (lbs/kg):</label>
                    <input type="number" id="currentWeight" placeholder="e.g., 185" oninput="saveToLocalStorage()">
                </div>
                <div>
                    <label for="goalWeight">Goal Weight (lbs/kg):</label>
                    <input type="number" id="goalWeight" placeholder="e.g., 150" oninput="saveToLocalStorage()">
                </div>
            </div>
            <button onclick="updateJourney()">Calculate Cosmic Coordinates</button>
        </div>

        <div id="stats" class="stats-box">Enter your metrics to launch the spacecraft.</div>

        <!-- Vertical Cosmic Roadmap -->
        <div class="space-map" id="spaceMap">
            <div class="cosmic-line"></div>
            <div id="spaceship" class="spaceship">🚀</div>
            
            <!-- Milestones will be automatically generated by JavaScript here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
